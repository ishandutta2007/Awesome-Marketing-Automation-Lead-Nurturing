<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.18;
      stroke-width: 1;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Ambience in Background -->
  <circle cx="150" cy="80" r="140" fill="url(#glowGrad)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="6s" repeatCount="indefinite" />
    <animate attributeName="r" values="130;160;130" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="280" r="160" fill="url(#glowGrad)">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="7s" repeatCount="indefinite" />
    <animate attributeName="r" values="150;180;150" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- Background Grid Pattern -->
  <g>
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />

    <line x1="120" y1="0" x2="120" y2="360" class="grid-line" />
    <line x1="240" y1="0" x2="240" y2="360" class="grid-line" />
    <line x1="360" y1="0" x2="360" y2="360" class="grid-line" />
    <line x1="480" y1="0" x2="480" y2="360" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
    <line x1="720" y1="0" x2="720" y2="360" class="grid-line" />
    <line x1="840" y1="0" x2="840" y2="360" class="grid-line" />
    <line x1="960" y1="0" x2="960" y2="360" class="grid-line" />
    <line x1="1080" y1="0" x2="1080" y2="360" class="grid-line" />
  </g>

  <!-- Dynamic Animated Journey Wave in Background (Behind Text) -->
  <path d="M-50,230 Q 300,160 600,240 T 1250,220" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="15s" repeatCount="indefinite" />
  </path>
  <path d="M-50,260 Q 300,310 600,230 T 1250,270" fill="none" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="18s" repeatCount="indefinite" />
  </path>

  <!-- Dynamic Animated Data Particles traveling on tracks -->
  <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#badgeGlow)">
    <animateMotion path="M -50,230 Q 300,160 600,240 T 1250,220" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle cx="0" cy="0" r="4" fill="#c084fc" filter="url(#badgeGlow)">
    <animateMotion path="M -50,260 Q 300,310 600,230 T 1250,270" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="0" cy="0" r="3.5" fill="#34d399" filter="url(#badgeGlow)">
    <animateMotion path="M -50,230 Q 300,160 600,240 T 1250,220" dur="16s" begin="4s" repeatCount="indefinite" />
  </circle>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(600, 78)">
    <rect x="-175" y="-18" width="350" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <circle cx="-150" cy="-1" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#38bdf8" letter-spacing="1.5">CURATED ECOSYSTEM GUIDE</text>
  </g>

  <!-- FOREGROUND MAIN TITLE & SUBTITLE -->
  <g transform="translate(600, 142)">
    <text class="title-text" text-anchor="middle" fill="url(#titleGrad)" filter="url(#glow)">Awesome Marketing Automation</text>
  </g>
  <g transform="translate(600, 185)">
    <text class="title-text" text-anchor="middle" fill="url(#titleGrad)">&amp; Lead Nurturing</text>
  </g>

  <g transform="translate(600, 230)">
    <text class="subtitle-text" text-anchor="middle">Top SaaS Solutions &amp; Open-Source Alternatives for Growth, Pipelines &amp; Journeys</text>
  </g>

  <!-- Dynamic Feature Badges / Pills in Foreground Bottom -->
  <g transform="translate(200, 290)">
    <rect x="0" y="0" width="170" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.95" />
    <text x="85" y="22" text-anchor="middle" class="badge-text">⚡ Lead Scoring</text>
  </g>
  <g transform="translate(390, 290)">
    <rect x="0" y="0" width="190" height="36" rx="18" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" opacity="0.95" />
    <text x="95" y="22" text-anchor="middle" class="badge-text">🔄 Journey Builders</text>
  </g>
  <g transform="translate(600, 290)">
    <rect x="0" y="0" width="190" height="36" rx="18" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" opacity="0.95" />
    <text x="95" y="22" text-anchor="middle" class="badge-text">🤖 Agentic Outreach</text>
  </g>
  <g transform="translate(810, 290)">
    <rect x="0" y="0" width="190" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.95" />
    <text x="95" y="22" text-anchor="middle" class="badge-text">🛡️ Data Sovereignty</text>
  </g>

</svg>
